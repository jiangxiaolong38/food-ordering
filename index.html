<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>御膳坊 - 在线点餐</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🍜</text></svg>">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🍜</span>
                <div class="logo-text">
                    <h1>御膳坊</h1>
                    <span class="logo-sub">Yu Shan Fang · 传统中餐</span>
                </div>
            </div>
            <button class="cart-btn" id="cartToggle" aria-label="打开购物车">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2>匠心烹饪 · 经典味道</h2>
            <p>精选食材，传统工艺，每一道菜都是对美食的致敬</p>
        </div>
    </section>
    <nav class="categories" id="categories">
        <button class="category-btn active" data-category="all">全部</button>
        <button class="category-btn" data-category="凉菜">凉菜</button>
        <button class="category-btn" data-category="热菜">热菜</button>
        <button class="category-btn" data-category="主食">主食</button>
        <button class="category-btn" data-category="饮品">饮品</button>
        <button class="category-btn" data-category="汤品">汤品</button>
    </nav>
    <main class="menu-section">
        <div class="menu-grid" id="menuGrid"></div>
    </main>
    <aside class="cart-overlay" id="cartOverlay"></aside>
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>购物车</h2>
            <button class="cart-close" id="cartClose" aria-label="关闭购物车"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <span class="cart-empty-icon">🛒</span>
                <p>购物车是空的</p>
                <span class="cart-empty-sub">快去添加美食吧</span>
            </div>
        </div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total">
                <span>合计</span>
                <span class="total-price" id="totalPrice">¥0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">去下单</button>
        </div>
    </aside>
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <div class="modal-icon">✅</div>
            <h2 class="modal-title">下单成功!</h2>
            <p class="modal-desc">您的订单已提交，厨房正在为您准备美食。</p>
            <div class="modal-order-info">
                <div class="modal-order-row">
                    <span>订单编号</span>
                    <span id="orderId">#20240604-0001</span>
                </div>
                <div class="modal-order-row">
                    <span>预计等待</span>
                    <span>20-30 分钟</span>
                </div>
            </div>
            <button class="modal-btn" id="modalClose">知道了</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
